.cards{gap:12px}.city-header{color:#8a754e;border-color:#dfe7e1}.card{border:0;border-radius:24px;padding:17px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}.card:active{transform:scale(.992)}.card.status-deposee{border-left:0;box-shadow:inset 4px 0 #20a36f,var(--shadow)}.card.status-recuperee{border-left:0;box-shadow:inset 4px 0 #4b8edb,var(--shadow)}.card.status-volee,.card.status-perdue{border-left:0;box-shadow:inset 4px 0 #dc4b46,var(--shadow);background:linear-gradient(90deg,rgba(255,240,239,.75),var(--surface) 18%)}.card.status-remplacer{border-left:0;box-shadow:inset 4px 0 #dda038,var(--shadow)}.card.status-aucune{border-left:0;box-shadow:inset 4px 0 #a5b0aa,var(--shadow)}.card h4{font-size:1.06rem}.badge{padding:7px 9px;font-size:.69rem}.manager{background:#edf4f0;color:#4b6f62}.dark .manager{background:#173d32;color:#b9d4c9}.card-actions{gap:7px}.card-actions button,.card-actions a{border:0;border-radius:13px;padding:11px;background:var(--surface2)}.visit-btn{background:linear-gradient(135deg,#075b43,#087454)!important;box-shadow:0 8px 20px rgba(7,91,67,.18)}.more-actions-btn{border:0;background:#eaf2ee;color:#075b43}.dark .more-actions-btn{background:#173d32;color:#e8d29f}
.primary-btn{background:linear-gradient(135deg,#075b43,#087454);color:#fff;box-shadow:0 7px 18px rgba(7,91,67,.15)}.ghost-btn{border:0}.danger-btn{border:1px solid #ffd1cd}
.bottom-nav{bottom:max(12px,env(safe-area-inset-bottom));width:min(94%,650px);background:rgba(255,255,255,.91);border:1px solid rgba(255,255,255,.72);backdrop-filter:blur(20px);border-radius:24px;padding:7px;box-shadow:0 18px 50px rgba(14,48,38,.18)}.bottom-nav button{color:#819189;min-height:49px}.bottom-nav .active{background:#075b43;color:#fff;box-shadow:0 7px 18px rgba(7,91,67,.20)}body.dark .bottom-nav{background:rgba(13,42,34,.92);border-color:#1d493c}.bottom-nav span{font-size:.62rem}
.dashboard-card,.settings-card{border:0;border-radius:24px;box-shadow:var(--shadow)}.bar-track{background:#e8efeb}.bar-fill{background:linear-gradient(90deg,#075b43,#c79b45)}.priority-item,.user-row{border:0}.status-dot{border:1px solid var(--border)}
dialog{border-radius:28px;box-shadow:0 35px 90px rgba(5,35,27,.3)}dialog::backdrop{background:rgba(4,25,20,.58);backdrop-filter:blur(7px)}.dialog-body{padding:22px}.icon-btn{border:0;background:var(--surface2)}
.auth-screen{background:radial-gradient(circle at 50% -5%,#147357 0,#07503c 30%,#062b23 68%,#041d18 100%)}.auth-card{border-radius:32px;padding:28px;box-shadow:0 32px 90px rgba(0,0,0,.34);position:relative;overflow:hidden}.auth-card:before{content:"PÔLE SOCIAL • DRAVEIL";display:block;color:#9b7a38;font-size:.66rem;font-weight:950;letter-spacing:.17em;margin-bottom:14px}.auth-logo{width:64px;height:64px;border-radius:21px;background:linear-gradient(145deg,#075b43,#087454);color:#f5d993;font-size:.9rem;letter-spacing:.05em;box-shadow:0 10px 24px rgba(7,91,67,.24)}.auth-card h2{letter-spacing:-.04em}.auth-tabs{background:#eef3f0}.auth-tabs button.active{color:#075b43}
@media(max-width:760px){.app{padding-left:12px;padding-right:12px}.topbar:before{width:39px;height:39px;border-radius:13px}.hero{padding:22px 20px;border-radius:26px}.hero:after{right:-5px;top:-22px;font-size:7rem}.hero-btn{width:100%}.stats article{padding:14px;border-radius:19px}.stats strong{font-size:1.5rem}.card{border-radius:21px;padding:16px}.bottom-nav{width:calc(100% - 20px)}.dashboard-card,.settings-card{border-radius:21px}.auth-card{padding:24px 21px}}
